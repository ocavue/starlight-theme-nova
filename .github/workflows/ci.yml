name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

env:
  DO_NOT_TRACK: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build

      - name: Publish snapshot packages
        if: ${{ github.event_name == 'pull_request' }}
        run: ./node_modules/.bin/pkg-pr-new publish --pnpm ./packages/starlight-theme-nova ./packages/shiki-twoslash-renderer

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node-version: [22, 24, 26]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Playwright Browsers
        run: pnpm run test:install

      - name: Build
        run: pnpm run build

      - name: Run screenshot tests
        run: pnpm run test

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node-version: [22, 24, 26]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Print versions
        run: |
          node --version
          npm --version

      - name: Set e2e directory
        run: echo "E2E_DIR=$RUNNER_TEMP/e2e-website" >> "$GITHUB_ENV"

      - name: Build theme package
        run: pnpm --filter ./packages/starlight-theme-nova run build

      - name: Prepare standalone website
        run: node scripts/prepare-e2e.mjs "$E2E_DIR"

      - name: Pack theme
        run: cd packages/starlight-theme-nova && pnpm pack --out "$E2E_DIR/starlight-theme-nova.tgz"

      - name: Install standalone website
        run: cd "$E2E_DIR" && npm install

      - name: Build standalone website
        run: cd "$E2E_DIR" && npm run build

      - name: Verify build output
        run: |
          cd "$E2E_DIR"
          test -f dist/index.html
          test -f dist/components/aside/index.html

  screenshot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Install Playwright Browsers
        run: pnpm run test:install

      - name: Build
        run: pnpm run build

      - name: Run screenshot tests
        id: test
        continue-on-error: true
        run: pnpm run test

      - name: Upload Playwright report
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.os }}
          path: website/playwright-report/

      - name: Update snapshots if tests failed
        if: steps.test.outcome == 'failure'
        run: pnpm run test:update

      - name: Configure git
        if: steps.test.outcome == 'failure' && github.ref != 'refs/heads/master'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push snapshot changes
        if: steps.test.outcome == 'failure' && github.ref != 'refs/heads/master'
        run: |
          git add --all
          git commit -m "chore: [skip ci] update snapshots"
          git pull --rebase
          git push

      - name: Fail if snapshots changed
        if: steps.test.outcome == 'failure'
        run: exit 1
